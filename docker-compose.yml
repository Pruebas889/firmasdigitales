services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    image: docuseal/docuseal:latest
    ports:
      - "3000:3000"
    volumes:
      - ./docuseal/:/data/docuseal
      - ./app/controllers/:/app/app/controllers
      - ./public/:/app/public
      - ./app/javascript/:/app/app/javascript
      - ./app/jobs/:/app/app/jobs
      - ./app/mailers/:/app/app/mailers
      - ./app/models/:/app/app/models
      - ./app/services/:/app/app/services
      - ./app/views/:/app/app/views
      - ./entrypoint.sh:/app/entrypoint.sh:rw
      - ./lib/:/app/lib
      - ./config/:/app/config
      - ./Gemfile:/app/Gemfile
      - ./Gemfile.lock:/app/Gemfile.lock
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./tailwind.application.config.js:/app/tailwind.application.config.js
      - ./tailwind.form.config.js:/app/tailwind.form.config.js
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - HOST=192.168.21.30
      - FORCE_SSL=false
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/docuseal
    networks:
      - docuseal_net

  postgres:
    image: postgres:15
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - docuseal_net

  caddy:
    image: caddy:latest
    command: caddy reverse-proxy --from 192.168.21.37 --to app:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy_data:/data
    environment:
      - HOST=192.168.21.37
    depends_on:
      - app
    networks:
      - docuseal_net

networks:
  docuseal_net:
    driver: bridge